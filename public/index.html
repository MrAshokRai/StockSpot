<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Site</title>
    <style>
        :root { --primary: #3b82f6; --dark-bg: #0f172a; --text-light: #ffffff; --text-dark: #1e293b; }
        body { font-family: Inter, system-ui, sans-serif; background-color: var(--dark-bg); color: var(--text-light); margin: 0; padding: 4rem 2rem; line-height: 1.6; }
        h1, h2, h3 { margin-top: 0; font-weight: 800; }
        .hero { text-align: center; margin-bottom: 3rem; padding: 3rem 1rem; background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(147,51,234,0.2)); border-radius: 1rem; }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); background: linear-gradient(to right, var(--primary), #8b5cf6); -webkit-background-clip: text; color: transparent; }
        .container { max-width: 900px; margin: 0 auto; }
        button { padding: calc(1rem * 0.75); font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 700; border: none; border-radius: 0.5rem; cursor: pointer; margin: 1rem auto !important; }
        .btn-primary { background-color: var(--primary); color: #fff; box-shadow: 0 4px 6px rgba(59,130,246,0.3); transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 12px rgba(59,130,246,0.4); }
        .card { background: #1e293b; border-radius: 1rem; padding: 2rem; margin: 1rem auto; max-width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .btn-secondary { background-color: transparent; border: 2px solid #64748b; color: var(--text-light); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .footer { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #334155; font-size: 0.9rem; color: var(--text-dark); }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1 id="headline-title">Headline Ban App</h1>
            <p>Create your headline in one line, then hit publish instantly.</p>
        </header>
        
        <main style="margin-top: 3rem;">
            <div class="card">
                <label for="headline-input" style="display:block; margin-bottom:0.5rem; font-weight:700; color:#94a3b8; font-size:0.95rem;">Headline (Type here, then submit to publish!)</label>
                <input type="text" id="headline-input" class="border-2 border-white/30 rounded-lg px-6 py-4 text-xl text-white focus:bg-white/10 transition-all" placeholder="Enter a headline that NEEDS attention...">
                <button onclick="publishHeadline()" class="btn-primary button-full-width">
                    Publish Headline
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>This site features automatic netlify auto-deploy. No manual deployment needed!</p>
        </footer>
        
        <!-- .site.json for Netlify - hidden but critical -->
        <form id="netlify-form" style="display:none">
            <textarea id="netlify-title-input" oninput="handleTitle()" rows="3" placeholder="Site Title" maxlength="50"></textarea>
            <button type="submit" class="btn-secondary button-full-width" onclick="window.location.href='#'">Submit (Hidden)</button>
        </form>
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/popover.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const titleEl = document.getElementById('headline-title');
        const inputEl = document.getElementById('headline-input');
        const netlifyForm = document.getElementById('netlify-form');
        const netlifyTitleInput = document.getElementById('netlify-title-input');
        
        function handleTitle() {
            const txt = netlifyTitleInput.value.trim();
            if (txt) titleEl.textContent = txt;
            else titleEl.textContent = "Headline Ban App";
        }

        async function publishHeadline() {
            const headline = inputEl.value.trim();
            if (!headline) return alert('Add a headline first!');
            
            const btn = event.target.querySelector('.btn-primary');
            btn.innerHTML = '🎉 Publishing...';
            
            try {
                // Simulating netlify deploy by checking .site.json
                const response = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ headline })
                });
                
                if (response.ok) {
                    alert(`✅ Headline published! (${headline})`);
                    inputEl.value = '';
                }
            } catch (e) {}
            
            // Reset button and hide form
            event.target.querySelector('.btn-primary').innerHTML = '💾 Saved';
            netlifyForm.style.display = 'none';
        }
    </script>
</body>
</html>
